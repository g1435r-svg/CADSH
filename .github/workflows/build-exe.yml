name: Build Windows EXE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: maaser-chomesh-upload

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build portable EXE
        run: npm run build:exe

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: maaser-chomesh-windows-exe
          path: maaser-chomesh-upload/dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-build --yes 2>/dev/null || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/latest-build" 2>/dev/null || true
          gh release create latest-build "$GITHUB_WORKSPACE/maaser-chomesh-upload/dist/MaaserChomesh.exe" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MaaserChomesh - Latest Build" \
            --notes "## הורדה ישירה

לחץ על **MaaserChomesh.exe** למטה להורדה והרצה מיידית על Windows.

> הקובץ נבנה אוטומטית ב-GitHub Actions." \
            --latest
