name: Build & Release Windows EXE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: maaser-chomesh-upload

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build portable EXE
        run: npm run build:exe

      - name: Resolve EXE path
        id: exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter *.exe | Select-Object -First 1
          if (-not $exe) {
            throw "No EXE file found under dist/."
          }
          "exe_path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v5
        with:
          name: MaaserChomesh-Windows-EXE
          path: maaser-chomesh-upload/dist/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Create / update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: latest-build
          RELEASE_NAME: "📦 גרסה אחרונה — מעשרות וחומש"
          RELEASE_NOTES: |
            ## הורדה ישירה של קובץ EXE

            לחץ על הקובץ **MaaserChomesh.exe** למטה להורדה ישירה.

            **מה כולל ה-EXE החדש:**
            - 📊 לוח בקרה עם סיכום הכנסות, מעשר וחומש
            - 📋 ניהול רשומות הכנסות ותרומות
            - 📈 דוחות חודשיים / שנתיים עם גרפים
            - ⬆️ ייבוא אקסל אופליין (בנק, אשראי)
            - 💾 גיבוי ייצוא / ייבוא JSON, CSV, XLSX
            - 🗑 מחיקת כל הנתונים עם גיבוי מלא לפני המחיקה
            - 🌙 מצב לילה
            - ↩ בטל / שחזר פעולה
            - קטגוריות לתרומות, סטטיסטיקות מפורטות

            > **לא נדרשת התקנה** — קובץ נייד (Portable)

            ---
            בנייה אוטומטית מ-commit: ${{ github.sha }}
        run: |
          $exePath = "${{ steps.exe.outputs.exe_path }}"
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --title $env:RELEASE_NAME --notes $env:RELEASE_NOTES --latest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $env:RELEASE_NAME --notes $env:RELEASE_NOTES --latest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $env:RELEASE_TAG $exePath --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
