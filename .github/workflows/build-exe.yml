name: Build Windows EXE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: maaser-chomesh-upload

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build portable EXE
        run: npm run build:exe

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: maaser-chomesh-windows-exe
          path: maaser-chomesh-upload/dist/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MaaserChomesh - Build ${{ github.run_number }}
          body: |
            ### מחשבון מעשרות וחומש
            קובץ EXE נייד להורדה והפעלה ישירה ב-Windows, ללא התקנה.

            **הורדה:** לחץ על הקובץ `MaaserChomesh*.exe` מטה.
          files: maaser-chomesh-upload/dist/*.exe
          make_latest: true
