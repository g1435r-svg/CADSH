name: Build Windows EXE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-exe-latest
  cancel-in-progress: true

jobs:
  build-windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: maaser-chomesh-upload

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build portable EXE
        run: npm run build:exe

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: maaser-chomesh-windows-exe
          path: maaser-chomesh-upload/dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-build --yes 2>/dev/null || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/latest-build" 2>/dev/null || true
          shopt -s nullglob
          exe_files=("$GITHUB_WORKSPACE"/maaser-chomesh-upload/dist/*.exe)
          if [ "${#exe_files[@]}" -eq 0 ]; then
            echo "No EXE file found in maaser-chomesh-upload/dist"
            exit 1
          fi
          EXE_FILE="${exe_files[0]}"
          EXE_NAME="$(basename "$EXE_FILE")"
          NOTES="$(printf '## הורדה ישירה\n\nלחץ על **%s** למטה להורדה והרצה מיידית על Windows.\n\n> הקובץ נבנה אוטומטית ב-GitHub Actions.' "$EXE_NAME")"
          gh release create latest-build "$EXE_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "מערכת יבא יצא - Latest Build" \
            --notes "$NOTES" \
            --latest
