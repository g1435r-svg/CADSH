name: Build & Release Windows EXE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: maaser-chomesh-upload

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build portable EXE
        run: npm run build:exe

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: MaaserChomesh-Windows-EXE
          path: maaser-chomesh-upload/dist/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releaseTitle = "📦 גרסה אחרונה — מעשרות וחומש"
          @'
          ## הורדה ישירה של קובץ EXE

          לחץ על הקובץ **MaaserChomesh.exe** למטה להורדה ישירה.

          **מה כולל האפליקציה:**
          - 📊 לוח בקרה עם סיכום הכנסות, מעשר וחומש
          - 📋 ניהול רשומות הכנסות ותרומות
          - 📈 דוחות חודשיים / שנתיים עם גרפים
          - ⬆️ ייבוא מאקסל (בנק, אשראי)
          - 💾 גיבוי ייצוא / ייבוא JSON, CSV, XLSX
          - 🌙 מצב לילה
          - ↩ בטל / שחזר פעולה
          - קטגוריות לתרומות, סטטיסטיקות מפורטות

          > **לא נדרשת התקנה** — קובץ נייד (Portable)

          ---
          בנייה אוטומטית מ-commit: ${{ github.sha }}
          '@ | Set-Content -Path release-notes.md -Encoding utf8

          gh release view latest-build *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload latest-build dist/MaaserChomesh.exe --clobber
            gh release edit latest-build --title $releaseTitle --notes-file release-notes.md
          } else {
            gh release create latest-build dist/MaaserChomesh.exe --title $releaseTitle --notes-file release-notes.md --target $env:GITHUB_SHA --latest
          }
