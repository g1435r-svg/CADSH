name: Build Windows EXE
# Builds a portable offline EXE for Windows (Chart.js + XLSX bundled locally)
# Updated: 2026-07-28

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-exe-release
  cancel-in-progress: true

jobs:
  build-windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: maaser-chomesh-upload

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: maaser-chomesh-upload/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build portable EXE
        run: npm run build:exe

      - name: Resolve EXE path
        id: exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter *.exe | Select-Object -First 1
          if (-not $exe) {
            throw "No EXE file found under dist/."
          }
          "exe_path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "exe_name=$($exe.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: maaser-chomesh-windows-exe
          path: maaser-chomesh-upload/dist/*.exe
          if-no-files-found: error

      - name: Create or update latest release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          target_commitish: ${{ github.sha }}
          name: MaaserChomesh - Latest Build
          body: |
            ### מחשבון מעשרות וחומש
            קובץ EXE נייד להורדה והפעלה ישירה ב-Windows, ללא התקנה.

            **מה חדש בבנייה הזאת:**
            - בנייה אוטומטית בענן GitHub
            - קובץ EXE אופליין (ללא CDN)
            - הורדה ישירה מתוך Releases

            **הורדה:** לחץ על הקובץ `${{ steps.exe.outputs.exe_name }}` מטה.
          files: ${{ steps.exe.outputs.exe_path }}
          overwrite_files: true
          make_latest: true
