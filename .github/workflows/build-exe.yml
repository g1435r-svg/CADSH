name: Build & Release Windows EXE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: maaser-chomesh-upload

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build portable EXE
        run: npm run build:exe

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: MaaserChomesh-Windows-EXE
          path: maaser-chomesh-upload/dist/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Create / update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag   = "latest-build"
          $title = "📦 גרסה אחרונה — מעשרות וחומש"
          $notes = @"
          ## הורדה ישירה של קובץ EXE

          לחץ על הקובץ **MaaserChomesh.exe** למטה להורדה ישירה.

          **מה כולל האפליקציה:**
          - 📊 לוח בקרה עם סיכום הכנסות, מעשר וחומש
          - 📋 ניהול רשומות הכנסות ותרומות
          - 📈 דוחות חודשיים / שנתיים עם גרפים
          - ⬆️ ייבוא מאקסל (בנק, אשראי)
          - 💾 גיבוי ייצוא / ייבוא JSON, CSV, XLSX
          - 🌙 מצב לילה
          - ↩ בטל / שחזר פעולה
          - קטגוריות לתרומות, סטטיסטיקות מפורטות

          > **לא נדרשת התקנה** — קובץ נייד (Portable)

          ---
          בנייה אוטומטית מ-commit: ${{ github.sha }}
          "@

          # Delete existing release + tag so we can recreate cleanly
          gh release delete $tag --yes 2>$null; $true
          git push origin ":refs/tags/$tag" 2>$null; $true

          # Create fresh release with the EXE
          gh release create $tag dist\MaaserChomesh.exe `
            --title $title `
            --notes $notes `
            --latest
