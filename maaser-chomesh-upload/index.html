<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>מערכת יבא יצא</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="card hero">
        <h1>מערכת יבא יצא</h1>
        <p>ניהול הכנסות והוצאות, שמירה מקומית, ייבוא/ייצוא נתונים</p>
      </header>

      <section class="card">
        <h2>סיכום מהיר</h2>
        <div class="stats">
          <article>
            <h3>סה"כ יבא</h3>
            <p id="total-in">₪0.00</p>
          </article>
          <article>
            <h3>סה"כ יצא</h3>
            <p id="total-out">₪0.00</p>
          </article>
          <article>
            <h3>יתרה</h3>
            <p id="balance">₪0.00</p>
          </article>
          <article>
            <h3>כמות רשומות</h3>
            <p id="entries-count">0</p>
          </article>
        </div>
      </section>

      <section class="card">
        <h2 id="form-title">רישום חדש</h2>
        <form id="entry-form" class="form-grid">
          <input type="hidden" id="editing-id" />

          <label>
            סוג
            <select id="type" required>
              <option value="income">יבא (הכנסה)</option>
              <option value="expense">יצא (הוצאה/תרומה)</option>
            </select>
          </label>

          <label>
            תאריך
            <input type="date" id="date" required />
          </label>

          <label>
            תיאור
            <input type="text" id="description" required placeholder="למשל: משכורת / קניה" />
          </label>

          <label>
            סכום
            <input type="number" id="amount" required min="0" step="0.01" placeholder="0.00" />
          </label>

          <label>
            הערות
            <input type="text" id="notes" placeholder="אופציונלי" />
          </label>

          <div class="form-actions">
            <button type="submit" class="btn primary" id="save-btn">שמור</button>
            <button type="button" class="btn" id="cancel-edit-btn">ביטול עריכה</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>כל הרשומות</h2>
        <div class="toolbar">
          <input id="search" type="search" placeholder="חיפוש בתיאור/הערות" />
          <div class="toolbar-actions">
            <button id="export-btn" class="btn" type="button">ייצוא JSON</button>
            <label class="btn upload-btn">
              ייבוא JSON
              <input id="import-input" type="file" accept="application/json" hidden />
            </label>
            <button id="clear-btn" class="btn danger" type="button">ניקוי הכל</button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>סוג</th>
                <th>תאריך</th>
                <th>תיאור</th>
                <th>סכום</th>
                <th>הערות</th>
                <th>פעולות</th>
              </tr>
            </thead>
            <tbody id="entries-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
